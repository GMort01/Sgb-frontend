services:
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    command: npm run dev -- --host 0.0.0.0
    networks:
      - sgb-network

volumes:
  frontend_modules:

networks:
  sgb-network:
    name: sgb-network
    external: true
